# Pre-commit hooks for LogOS
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: LogOS host gate
        entry: powershell -NoProfile -File scripts/check.ps1 -Stage host
        language: system
        types: [rust]
        pass_filenames: false
        always_run: true

      - id: uefi-build
        name: LogOS UEFI build gate
        entry: powershell -NoProfile -File scripts/check.ps1 -Stage uefi
        language: system
        types: [rust]
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.41.0
    hooks:
      - id: markdownlint
        name: Markdown lint
        files: docs/
        stages: [pre-commit, pre-push]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        name: Spell check
        files: [docs/, src/]
        stages: [pre-commit, pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
        files: \.(rs|md|toml|py|json|yaml|yml)$
      - id: end-of-file-fixer
        name: Ensure newline at EOF
        files: \.(rs|md|toml|py|json|yaml|yml)$
      - id: check-yaml
        name: Validate YAML
        files: \.(yaml|yml)$
      - id: check-toml
        name: Validate TOML
        files: \.toml$
      - id: check-json
        name: Validate JSON
        files: \.json$
      - id: mixed-line-ending
        name: Consistent line endings
        args: ["--fix=lf"]
