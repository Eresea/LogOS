[package]
name = "logos-remote"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
chacha20poly1305 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
logos-abi = { path = "../logos-abi" }
noise-protocol = { version = "0.2", default-features = false }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets", "zeroize"] }
