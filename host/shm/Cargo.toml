[package]
name = "logos-host-shm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
test = true
bench = false

[dependencies]
logos-abi = { path = "../../abi" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
