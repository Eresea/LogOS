name: Testing Main Tier
on:
  push:
    branches: [main, master]
jobs:
  qemu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: x86_64-unknown-uefi}
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - run: cargo run -p logos-test -- suite main
        env: {OVMF_CODE: /usr/share/OVMF/OVMF_CODE.fd}
      - if: failure()
        uses: actions/upload-artifact@v4
        with: {name: logos-test-main, path: target/logos-test}
