name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTUP_TOOLCHAIN: stable

jobs:
  host:
    name: Host checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install target
        run: rustup target add x86_64-unknown-uefi
      - name: Run host gate
        shell: pwsh
        run: ./scripts/check.ps1 -Stage host

  uefi:
    name: UEFI payload builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: host
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install target
        run: rustup target add x86_64-unknown-uefi
      - name: Build UEFI payloads
        shell: pwsh
        run: ./scripts/check.ps1 -Stage uefi -Release
      - name: Upload payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logos-uefi-payloads
          path: |
            target/logos-check/uefi/release
            target/logos-check/esp/release

  qemu:
    name: QEMU suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [host, uefi]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install target and QEMU
        run: |
          rustup target add x86_64-unknown-uefi
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
      - name: Run QEMU suite
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE.fd
          LOGOS_TEST_ARTIFACTS: all
        shell: pwsh
        run: ./scripts/verify.ps1 -Suite ${{ github.event_name == 'pull_request' && 'pr' || 'main' }}
      - name: Upload QEMU artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logos-test
          path: target/logos-test

  release:
    name: Release readiness
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [host, uefi, qemu]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install target
        run: rustup target add x86_64-unknown-uefi
      - name: Rebuild release payloads
        shell: pwsh
        run: ./scripts/check.ps1 -Stage uefi -Release
      - name: Hash payloads
        run: sha256sum target/logos-check/uefi/release/*.efi
      - name: Upload release payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logos-release-payloads
          path: |
            target/logos-check/uefi/release
            target/logos-check/esp/release
