name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup target add x86_64-unknown-uefi x86_64-unknown-none
      - run: cargo fmt --check
      - run: cargo test --workspace
      - run: cargo clippy --lib -- -D warnings
      - run: cargo clippy --target x86_64-unknown-uefi -- -D warnings
      - run: cargo build --release --target x86_64-unknown-uefi
      - run: cargo build --target x86_64-unknown-none -p logos-service-images --bins
      - run: cargo clippy --target x86_64-unknown-none -p logos-service-images --bins -- -D warnings
