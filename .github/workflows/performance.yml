name: Performance Baseline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  qemu-boot-time:
    name: Boot Time Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-uefi

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-${{ runner.os }}-perf-${{ hashFiles('**/Cargo.lock') }}

      - name: Install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86-64 ovmf

      - name: Build release kernel
        run: cargo build --release --target x86_64-unknown-uefi

      - name: Measure boot time
        env:
          OVMF_CODE: /usr/share/OVMF/OVMF_CODE.fd
        run: |
          echo "# Boot Time Baseline" > boot-metrics.md
          echo "" >> boot-metrics.md
          echo "Build timestamp: $(date -u)" >> boot-metrics.md
          echo "Git SHA: ${{ github.sha }}" >> boot-metrics.md
          echo "" >> boot-metrics.md
          echo "\`\`\`" >> boot-metrics.md

          # Run QEMU and capture timing info
          # This is a placeholder; adjust the actual measurement logic as needed
          time timeout 60 ./scripts/verify.ps1 >> boot-metrics.md 2>&1 || true

          echo "\`\`\`" >> boot-metrics.md

      - name: Upload boot metrics
        uses: actions/upload-artifact@v4
        with:
          name: boot-metrics-${{ github.sha }}
          path: boot-metrics.md
          retention-days: 90

      - name: Comment on PR with metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const metrics = fs.readFileSync('boot-metrics.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: metrics
            });
