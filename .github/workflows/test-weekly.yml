name: Testing Weekly Tier
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
jobs:
  resilience:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup target add x86_64-unknown-uefi
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf
      - run: cargo run -p logos-test -- suite weekly
        env: {OVMF_CODE: /usr/share/OVMF/OVMF_CODE.fd}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: {name: logos-test-weekly, path: target/logos-test}
