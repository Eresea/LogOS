[package]
name = "logos-vnext"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace]
members = [
    "abi",
    "package",
    "network",
    "storage",
    "services/flow",
    "services/device",
    "services/user",
    "services/display",
    "services/input",
    "services/session",
    "services/storage",
    "services/terminal",
    "services/fetch",
    "services/shell",
    "services/lockscreen",
    "services/images",
    "ui",
    "ui-forms",
    "ui-compiler",
]
resolver = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
uefi = { version = "0.35" }
logos-abi = { path = "abi" }
logos-package = { path = "package" }
logos-storage = { path = "storage" }

[features]
default = []
qemu-proof = []
package-proof = ["qemu-proof"]
storage-proof = []
fetch-proof = []

[lib]
name = "logos_vnext"
path = "src/lib.rs"
test = true
bench = false

[[bin]]
name = "logos-vnext"
path = "src/main.rs"
test = false
bench = false
