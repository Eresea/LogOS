[package]
name = "logos-vnext"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
uefi = { version = "0.35" }

[features]
default = []
qemu-proof = []

[lib]
name = "logos_vnext"
path = "src/lib.rs"
test = true
bench = false

[[bin]]
name = "logos-vnext"
path = "src/main.rs"
test = false
bench = false
