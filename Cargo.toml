[package]
name = "logos-vnext"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace]
members = [
    "abi",
    "storage",
    "services/commands",
    "services/display",
    "services/input",
    "services/session",
    "services/storage",
    "services/terminal",
    "services/images",
]
resolver = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[dependencies]
uefi = { version = "0.35" }
logos-abi = { path = "abi" }
logos-storage = { path = "storage" }

[features]
default = []
qemu-proof = []
storage-proof = []

[lib]
name = "logos_vnext"
path = "src/lib.rs"
test = true
bench = false

[[bin]]
name = "logos-vnext"
path = "src/main.rs"
test = false
bench = false
